name: Arcade exact-source acceptance
on:
  push:
    branches: [codex/verify-arcade-acceptance-r162]
permissions:
  contents: read
jobs:
  acceptance:
    name: ${{ matrix.task }} exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: flight-fuel
            source: 575edd9bc9bd782176d0c3ca7ecb81ceefd8060c
            checks: bounties/flight-fuel
          - task: board-undo
            source: e52ded74362b5d40ad88f44cbbf2fa14329899eb
            checks: bounties/board-undo
    env:
      CI: 'true'
      CHECKS: ${{ matrix.checks }}
      EXPECTED_SOURCE: ${{ matrix.source }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code HEAD
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Copy the pinned public checker fixtures
        shell: bash
        run: |
          test ! -e bounties
          git fetch --no-tags https://github.com/amiller/bounty-arcade.git 82323836a672b799ac8f9f74265498f97438cd02
          git archive 82323836a672b799ac8f9f74265498f97438cd02 bounties | tar -x
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Prepare isolated Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run full logic and browser acceptance
        run: npm test
      - name: Verify candidate source stayed unchanged
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code HEAD
          unexpected=$(git ls-files --others --exclude-standard | sed '/^bounties\//d')
          test -z "$unexpected"
